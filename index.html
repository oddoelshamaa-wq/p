<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مفكرتي السحابية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6c5ce7;
            --bg-dark: #1e1e30;
            --card-bg: #f8f9fb;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg-dark);
            overflow-x: hidden;
            overscroll-behavior-y: contain; 
        }

        .app-wrapper {
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; padding: 20px;
        }

        .main-container {
            background: #ededf2; width: 100%; max-width: 900px;
            border-radius: 30px; padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            min-height: 85vh;
        }

        #login-screen { text-align: center; max-width: 400px; margin: 60px auto; }
        .login-card { background: #fff; padding: 40px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .btn-logout { background: #ff7675; color: white; border: none; padding: 8px 18px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        .input-group { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
        .input-group input {
            flex: 1; min-width: 140px; padding: 15px; border: none;
            border-radius: 12px; background: white; font-size: 15px;
        }
        .btn-save { background: var(--primary); color: white; border: none; padding: 0 35px; border-radius: 12px; font-weight: bold; cursor: pointer; height: 52px; }

        .cards-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .vault-card {
            background: white; border-radius: 22px; padding: 20px;
            border-bottom: 5px solid var(--primary);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .vault-card h4 { margin: 0 0 15px 0; display: flex; align-items: center; justify-content: flex-start; gap: 10px; font-size: 19px; }

        .data-row {
            background: var(--card-bg); padding: 12px 18px;
            border-radius: 12px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .data-row span { font-weight: 600; color: #333; font-size: 15px; }
        
        .icon-actions { display: flex; gap: 15px; color: var(--primary); font-size: 18px; cursor: pointer; }
        .icon-actions i:active { transform: scale(0.9); opacity: 0.7; }

        .actions { display: flex; gap: 12px; margin-top: 20px; }
        .btn-action { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-edit { background: #fff9db; color: #f59f00; }
        .btn-delete { background: #fff5f5; color: #fa5252; }

        @media (max-width: 600px) {
            .input-group { flex-direction: column; }
            .main-container { padding: 15px; border-radius: 20px; }
        }
    </style>
</head>
<body>

<div class="app-wrapper" id="app-body">
    
    <div id="login-screen">
        <div class="login-card">
            <i class="fas fa-lock" style="font-size: 45px; color: var(--primary); margin-bottom: 15px;"></i>
            <h2 style="margin-bottom: 25px;">خزنة مشفرة</h2>
            <input type="password" id="m-pass" style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 20px; text-align: center;" placeholder="كلمة السر">
            <button class="btn-save" style="width: 100%;" onclick="u789()">دخول</button>
        </div>
    </div>

    <div id="main-content" class="main-container" style="display: none;">
        <div class="header">
            <h2>مفكرتي السحابية ☁️</h2>
            <button class="btn-logout" onclick="location.reload()">خروج</button>
        </div>

        <div class="input-group">
            <input type="text" id="s-name" placeholder="اسم الموقع">
            <input type="text" id="s-mail" placeholder="الإيميل">
            <input type="password" id="s-pass" placeholder="كلمة السر">
            <button class="btn-save" onclick="v123()">حفظ</button>
        </div>

        <div id="list" class="cards-list"></div>
    </div>
</div>

<script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) return false;
    };
    setInterval(function() {
        if (window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160) {
            document.body.innerHTML = '<h2 style="color:white;text-align:center;padding:50px">⚠️ محاولة اختراق!</h2>';
            location.reload();
        }
    }, 1000);
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const f_c = {
        apiKey: "AIzaSyC67xHqcheCvjWinFgh3FV6OK8cO0k6wPg",
        authDomain: "pasward-9328f.firebaseapp.com",
        projectId: "pasward-9328f",
        storageBucket: "pasward-9328f.firebasestorage.app",
        messagingSenderId: "64746748180",
        appId: "1:64746748180:web:b41796adc5f5c112e5aa01"
    };

    const a = initializeApp(f_c);
    const d = getFirestore(a);
    const c = collection(d, "vault");

    window.u789 = function() {
        if(document.getElementById('m-pass').value === "2002") {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            start();
        } else { alert("خطأ!"); }
    };

    window.v123 = async function() {
        const n = document.getElementById('s-name').value, m = document.getElementById('s-mail').value, p = document.getElementById('s-pass').value;
        if(n && m && p) {
            await addDoc(c, { n, m, p, t: Date.now() });
            document.querySelectorAll('.input-group input').forEach(i => i.value = '');
        }
    };

    function start() {
        onSnapshot(c, (s) => {
            const l = document.getElementById('list'); l.innerHTML = '';
            s.docs.forEach(doc => {
                const data = doc.data();
                l.innerHTML += `
                <div class="vault-card">
                    <h4> ${data.n} <i class="fas fa-shield-alt" style="margin-right:auto"></i></h4>
                    
                    <div class="data-row">
                        <span>الإيميل: ${data.m}</span>
                        <div class="icon-actions">
                            <i class="far fa-copy" onclick="navigator.clipboard.writeText('${data.m}'); alert('تم نسخ الإيميل')"></i>
                        </div>
                    </div>

                    <div class="data-row">
                        <span>السر: ••••••••</span>
                        <div class="icon-actions">
                            <i class="far fa-eye" onclick="alert('السر هو: ${data.p}')"></i>
                            <i class="far fa-copy" onclick="navigator.clipboard.writeText('${data.p}'); alert('تم نسخ كلمة السر')"></i>
                        </div>
                    </div>

                    <div class="actions">
                        <button class="btn-action btn-edit">تعديل</button>
                        <button class="btn-action btn-delete" onclick="window.del('${doc.id}')">حذف</button>
                    </div>
                </div>`;
            });
        });
    }

    window.del = async (id) => { if(confirm("حذف؟")) await deleteDoc(doc(d, "vault", id)); };
</script>

</body>
</html>
